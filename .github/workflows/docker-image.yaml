name: Docker Image CI

on:
  push:
    tags:
      - "*-v*.*.*"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Extract repository and tag from git tag
      id: extract
      run: |
        TAG_NAME="${{ github.ref_name }}"
        echo "repo=${TAG_NAME%-*}" >> $GITHUB_OUTPUT
        echo "tag=${TAG_NAME##*-}" >> $GITHUB_OUTPUT
    - name: Validate repo name matches branch name
      run: |
        BRANCH="${{ github.event.base_ref }}"
        BRANCH="${BRANCH##refs/heads/}"
        REPO="${{ steps.extract.outputs.repo }}"
        if [ "$REPO" != "$BRANCH" ]; then
          echo "Error: tag repo '$REPO' does not match branch '$BRANCH'"
          exit 1
        fi
    - name: Validate repo name matches branch name
      run: |
        BRANCH="${{ github.event.base_ref }}"
        BRANCH="${BRANCH##refs/heads/}"
        REPO="${{ steps.extract.outputs.repo }}"
        if [ "$REPO" != "$BRANCH" ]; then
          echo "Error: tag repo '$REPO' does not match branch '$BRANCH'"
          exit 1
        fi
    - name: Build, Tag & Publish Image to DockerHub
      uses: dinushchathurya/build-tag-push-action@v1.2.1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        context: .
        file: ./Dockerfile
        repoOwner: ${{ secrets.DOCKER_USERNAME }}
        repository: ${{ steps.extract.outputs.repo }}
        tag: ${{ steps.extract.outputs.tag }}